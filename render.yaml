services:
  - type: web
    name: foliospace
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: FolioSpace <hello@foliospace.in>
      - key: RESEND_REPLY_TO
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LAUNCH_DATE
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: USER_SESSION_SECRET
        sync: false
      - key: INTERNAL_TRUST_TOKEN
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_API_VERSION
        value: 2025-01-01
      - key: CASHFREE_ENV
        value: production
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_PLAN_ID_PRO_YEAR1_DISCOUNT
        sync: false
      - key: CASHFREE_PLAN_ID_PRO_YEAR2_FULL
        sync: false
      - key: PRO_YEAR1_INR
        value: 899
      - key: PRO_YEAR2_INR
        value: 1499
      - key: TRIAL_DAYS
        value: 0
      - key: FOUNDER_COHORT_LIMIT
        value: 100

  # Phase C: referral-program backstop. Runs at 03:00 IST (UTC: 30 21 * * *)
  # daily. UPGRADE-ONLY — only swaps year-2 -> year-1. Uses INTERNAL_TRUST_TOKEN
  # as a startup guard (matches the pattern Render Cron expects).
  - type: cron
    name: foliospace-referral-evaluator
    env: python
    region: oregon
    plan: free
    schedule: "30 21 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.referral_evaluator
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_TRUST_TOKEN
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: production
      - key: CASHFREE_API_VERSION
        value: 2025-01-01
      - key: CASHFREE_PLAN_ID_PRO_YEAR1_DISCOUNT
        sync: false
      - key: CASHFREE_PLAN_ID_PRO_YEAR2_FULL
        sync: false

  # Comp-grant expiry warnings (14d / 7d / 1d) + stale-state cleanup.
  # Runs at 02:00 IST (UTC: 30 20 * * *) — 30 min before the referral
  # evaluator at 21:30 UTC so the comp flip settles first.
  - type: cron
    name: foliospace-comp-grant-expirer
    env: python
    region: oregon
    plan: free
    schedule: "30 20 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.comp_grant_expirer
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_TRUST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: FolioSpace <hello@foliospace.in>
      - key: RESEND_REPLY_TO
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
