<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1419" />
  <title>{% block title %}{{ page_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ description }}{% endblock %}" />
  <link rel="canonical" href="{{ request.url_for('landing') }}" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% block og_title %}{{ page_title }}{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}{{ description }}{% endblock %}" />
  <meta property="og:url" content="{{ request.url }}" />
  <meta property="og:site_name" content="{{ site_name }}" />
  <meta property="og:image" content="{{ request.url_for('static', path='img/og.png') }}" />
  <meta property="og:image:alt" content="FolioSpace — A portfolio for everyone. ₹150 setup, ₹99/month." />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}{{ page_title }}{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}{{ description }}{% endblock %}" />
  <meta name="twitter:image" content="{{ request.url_for('static', path='img/og.png') }}" />

  <link rel="icon" type="image/svg+xml" href="{{ request.url_for('static', path='img/favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..40,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Serif+Display:ital@0;1&family=Inter:wght@800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}" />
</head>
<body>
  <svg class="bg-topo" aria-hidden="true">
    <defs>
      <linearGradient id="topoFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="white" stop-opacity="0"/>
        <stop offset="12%" stop-color="white" stop-opacity="1"/>
        <stop offset="88%" stop-color="white" stop-opacity="1"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
      <mask id="topoMask">
        <rect width="100%" height="100%" fill="url(#topoFade)"/>
      </mask>
    </defs>
    <g stroke="currentColor" stroke-width="0.7" fill="none" mask="url(#topoMask)">
      <path d="M 0 90 Q 240 50, 480 90 T 960 90 T 1440 90"/>
      <path d="M 0 200 Q 360 160, 720 200 T 1440 200"/>
      <path d="M 0 310 Q 240 270, 480 310 T 960 310 T 1440 310"/>
      <path d="M 0 420 Q 360 380, 720 420 T 1440 420"/>
      <path d="M 0 530 Q 240 490, 480 530 T 960 530 T 1440 530"/>
      <path d="M 0 640 Q 360 600, 720 640 T 1440 640"/>
      <path d="M 0 750 Q 240 710, 480 750 T 960 750 T 1440 750"/>
      <path d="M 0 860 Q 360 820, 720 860 T 1440 860"/>
    </g>
  </svg>
  <a class="skip-link" href="#join">Skip to join waitlist</a>
  <div class="scroll-progress" aria-hidden="true"></div>
  <button class="cmd-k-fab" aria-label="Open command palette">
    <span class="cmd-k-icon">⌘K</span>
    <span class="cmd-k-text">Quick nav</span>
  </button>
  <div class="cmd-palette" aria-hidden="true">
    <div class="cmd-palette-backdrop"></div>
    <div class="cmd-palette-card">
      <div class="cmd-palette-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cmd-input" type="text" placeholder="Search pages, actions, or jump to…" autocomplete="off" />
        <kbd>ESC</kbd>
      </div>
      <ul class="cmd-palette-list" id="cmd-list"></ul>
      <div class="cmd-palette-foot">
        <span><kbd>↑↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>
  {% block content %}{% endblock %}
  <script src="{{ request.url_for('static', path='js/utm.js') }}"></script>
  <script src="{{ request.url_for('static', path='js/main.js') }}"></script>
</body>
</html>
