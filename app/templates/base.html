<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0E12" media="(prefers-color-scheme: dark)" />
  <title>{% block title %}{{ page_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ description }}{% endblock %}" />
  <meta name="robots" content="{% block robots %}index,follow{% endblock %}" />
  <link rel="canonical" href="{% block canonical %}{{ request.url }}{% endblock %}" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% block og_title %}{{ page_title }}{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}{{ description }}{% endblock %}" />
  <meta property="og:url" content="{{ request.url }}" />
  <meta property="og:site_name" content="{{ site_name }}" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:image" content="{{ request.url_for('static', path='img/og.png') }}?v={{ asset_v }}" />
  <meta property="og:image:alt" content="FolioSpace — A portfolio for every Indian professional. Chefs, developers, students, consultants, shop owners, agencies, founders. ₹150 setup, ₹99/month." />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}{{ page_title }}{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}{{ description }}{% endblock %}" />
  <meta name="twitter:image" content="{{ request.url_for('static', path='img/og.png') }}?v={{ asset_v }}" />
  <meta name="twitter:image:alt" content="FolioSpace — A portfolio for every Indian professional. Chefs, developers, students, consultants, shop owners, agencies, founders. ₹150 setup, ₹99/month." />

  <link rel="icon" type="image/svg+xml" href="{{ request.url_for('static', path='img/favicon.svg') }}?v={{ asset_v }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ request.url_for('static', path='img/apple-touch-icon.png') }}?v={{ asset_v }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Stalinist+One&family=Saira:wght@400;500;600;700;800&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Stalinist+One&family=Saira:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  {% block jsonld %}{% endblock %}

  <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}?v={{ asset_v }}" />
  <script defer src="{{ request.url_for('static', path='js/curtain.js') }}?v={{ asset_v }}"></script>
</head>
<body{% if launched %} data-launched="1"{% endif %}>
  <script src="{{ request.url_for('static', path='js/theme.js') }}?v={{ asset_v }}"></script>
  <a class="skip-link" href="#main">Skip to content</a>
  <svg class="bg-topo" aria-hidden="true">
    <defs>
      <linearGradient id="topoFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="white" stop-opacity="0"/>
        <stop offset="12%" stop-color="white" stop-opacity="1"/>
        <stop offset="88%" stop-color="white" stop-opacity="1"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </linearGradient>
      <mask id="topoMask">
        <rect width="100%" height="100%" fill="url(#topoFade)"/>
      </mask>
    </defs>
    <g stroke="currentColor" stroke-width="0.7" fill="none" mask="url(#topoMask)">
      <path d="M 0 90 Q 240 50, 480 90 T 960 90 T 1440 90"/>
      <path d="M 0 200 Q 360 160, 720 200 T 1440 200"/>
      <path d="M 0 310 Q 240 270, 480 310 T 960 310 T 1440 310"/>
      <path d="M 0 420 Q 360 380, 720 420 T 1440 420"/>
      <path d="M 0 530 Q 240 490, 480 530 T 960 530 T 1440 530"/>
      <path d="M 0 640 Q 360 600, 720 640 T 1440 640"/>
      <path d="M 0 750 Q 240 710, 480 750 T 960 750 T 1440 750"/>
      <path d="M 0 860 Q 360 820, 720 860 T 1440 860"/>
    </g>
  </svg>
    <div class="scroll-progress" aria-hidden="true"></div>
  <button class="cmd-k-fab" aria-label="Open command palette">
    <span class="cmd-k-icon">⌘K</span>
    <span class="cmd-k-text">Quick nav</span>
  </button>
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-labelledby="cmd-palette-title" aria-hidden="true">
    <h2 id="cmd-palette-title" class="sr-only">Quick navigation</h2>
    <div class="cmd-palette-backdrop"></div>
    <div class="cmd-palette-card">
      <div class="cmd-palette-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cmd-input" type="text" placeholder="Search pages, actions, or jump to…" aria-label="Search pages, actions, or jump to" autocomplete="off" />
        <kbd>ESC</kbd>
      </div>
      <ul class="cmd-palette-list" id="cmd-list"></ul>
      <div class="cmd-palette-foot">
        <span><kbd>↑↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>
  {% block content %}{% endblock %}
  <script defer src="{{ request.url_for('static', path='js/utm.js') }}?v={{ asset_v }}"></script>
  <script defer src="{{ request.url_for('static', path='js/main.js') }}?v={{ asset_v }}"></script>
</body>
</html>
