<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1419" />
  <title>{% block title %}{{ page_title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ description }}{% endblock %}" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

  <link rel="icon" type="image/svg+xml" href="{{ request.url_for('static', path='img/favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..40,0..1&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ request.url_for('static', path='css/admin.css') }}" />
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
